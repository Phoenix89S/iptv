name: Kusaka IPTV Collector

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 * * *"

  push:
    paths:
      - "Kusaka.py"
      - ".github/workflows/kusaka.yml"

permissions:
  contents: write

concurrency:
  group: kusaka
  cancel-in-progress: false

jobs:
  kusaka:
    name: Run Kusaka
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 aiohttp rich

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check Python
        run: |
          python --version
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Check Kusaka syntax
        run: |
          python -m py_compile Kusaka.py

      - name: Show Kusaka help
        run: |
          python Kusaka.py --help

      - name: Run Kusaka
        run: |
          python Kusaka.py

      - name: Show output
        if: always()
        run: |
          echo "===== FILES ====="
          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            -printf '%p (%s bytes)\n' | sort

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kusaka-results-${{ github.run_number }}
          path: |
            kusaka_output/
            *.m3u
            *.m3u8
            *.json
            *.jsonl
            *.txt
            *.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit generated results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Kusaka: update IPTV results"
            git push
          fi